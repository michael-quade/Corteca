# Deploys to Vercel on every push to the default branch.
# Vercel builds remotely using the env vars configured in the Vercel project,
# and registers the cron jobs from vercel.json as usual.
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked):
#   VERCEL_TOKEN       — Vercel account token
#   VERCEL_ORG_ID      — Vercel team/user ID
#   VERCEL_PROJECT_ID  — Vercel project ID
#   GITHUB_TOKEN       — optional; GitHub fine-grained token with Contents: read & write on
#                        michael-quade/Corteca. When set, main is also pushed to GitHub (the
#                        corporate proxy blocks pushes from laptops; project mirroring is admin-only).

stages:
  - deploy
  - mirror

deploy_production:
  stage: deploy
  image: node:24-alpine
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Deploy history (commit, author, time) under Operate → Environments in GitLab
  environment:
    name: production
    url: https://corteca.vercel.app
  script:
    # The Vercel CLI labels the deployment with commit SHA/message/branch read via git.
    # It silently skips this if git is missing, refuses the checkout (owned by another
    # user), or HEAD is detached — so install git, trust the dir, and check out the branch.
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
    # The CI clone URL embeds a job token; the CLI sends the origin URL to Vercel.
    - git remote set-url origin "$CI_PROJECT_URL.git"
    - npm install --global vercel@latest
    # The Vercel dashboard ignores CLI git metadata from a self-hosted GitLab, so also send
    # the meta fields Vercel's own GitLab integration sets — these make the commit message,
    # SHA and branch show in Vercel's Deployments list. (Its commit links point to gitlab.com
    # and won't resolve; use GitLab → Operate → Environments for links.)
    - >-
      vercel deploy --prod --yes --token "$VERCEL_TOKEN"
      --meta gitlabDeployment=1
      --meta "gitlabCommitMessage=$CI_COMMIT_TITLE"
      --meta "gitlabCommitSha=$CI_COMMIT_SHA"
      --meta "gitlabCommitRef=$CI_COMMIT_REF_NAME"
      --meta "gitlabCommitAuthorName=$GITLAB_USER_NAME"
      --meta "gitlabCommitAuthorLogin=$GITLAB_USER_LOGIN"
      --meta "gitlabProjectId=$CI_PROJECT_ID"
      --meta "gitlabProjectName=$CI_PROJECT_NAME"
      --meta "gitlabProjectNamespace=$CI_PROJECT_NAMESPACE"
      --meta "gitlabProjectPath=$CI_PROJECT_PATH"

mirror_github:
  stage: mirror
  image: alpine:3.20
  tags:
    - docker
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_TOKEN
  # A mirror failure must not mark the pipeline (or the deploy) as failed.
  allow_failure: true
  variables:
    # Full history: GitHub rejects a push from a shallow clone it doesn't have the base of.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Fast-forward only (no --force): if GitHub has commits GitLab doesn't, the job fails instead of dropping them.
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/michael-quade/Corteca.git" "$CI_COMMIT_SHA:refs/heads/main"
